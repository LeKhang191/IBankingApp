version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ibanking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibanking"]
      interval: 3s
      timeout: 3s
      retries: 5

  auth-service:
    build: 
      context: ./backend/auth-service
    ports:
      - "8000:8001"
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:5173
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ibanking
    depends_on:
      postgres:
        condition: service_healthy 

  tuition-service:
      build: 
        context: ./backend/tuition-service
      ports:
        - "8002:8001"  
      environment:
        - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ibanking
      depends_on:
        postgres:
          condition: service_healthy

  payment-service:
      build: 
        context: ./backend/payment-service
      ports:
        - "8003:8001"  
      environment:
        - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ibanking
      depends_on:
        postgres:
          condition: service_healthy

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app             
      - /app/node_modules
    depends_on:
      - auth-service