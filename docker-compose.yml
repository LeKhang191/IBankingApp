services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ibanking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibanking"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8000:8001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ibanking
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy

  tuition-service:
    build:
      context: ./backend/tuition-service
    ports:
      - "8002:8001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ibanking
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend/payment-service
    ports:
      - "8003:8001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ibanking
      AUTH_SERVICE_URL: http://auth-service:8001
      TUITION_SERVICE_URL: http://tuition-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      tuition-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build:
      context: ./backend/notification-service
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-iBanking <noreply@ibanking.local>}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    # Không publish cổng Notification ra host; chỉ Payment Service gọi qua Docker network.
    expose:
      - "8003"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_TUITION_API_URL: ${VITE_TUITION_API_URL:-http://localhost:8002}
      VITE_PAYMENT_API_URL: ${VITE_PAYMENT_API_URL:-http://localhost:8003}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - tuition-service
      - payment-service

volumes:
  pgdata:
