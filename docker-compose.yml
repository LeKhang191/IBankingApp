services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ibanking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/database:ro
    restart: unless-stopped

  # Idempotently creates three service-owned databases and login roles.
  # It also runs on an existing pgdata volume; PostgreSQL init scripts alone
  # would not run again after the first initialization.
  db-bootstrap:
    image: postgres:16-alpine
    command: ["sh", "/database/bootstrap/bootstrap-databases.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ibanking
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      TUITION_DB_NAME: ${TUITION_DB_NAME:-tuition_db}
      TUITION_DB_USER: ${TUITION_DB_USER:-tuition_user}
      TUITION_DB_PASSWORD: ${TUITION_DB_PASSWORD:?Set TUITION_DB_PASSWORD in .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_user}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    volumes:
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: ./backend/auth-service
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}@postgres:5432/${AUTH_DB_NAME:-auth_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  tuition-service:
    build:
      context: ./backend/tuition-service
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://${TUITION_DB_USER:-tuition_user}:${TUITION_DB_PASSWORD:?Set TUITION_DB_PASSWORD in .env}@postgres:5432/${TUITION_DB_NAME:-tuition_db}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend/payment-service
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://${PAYMENT_DB_USER:-payment_user}:${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}@postgres:5432/${PAYMENT_DB_NAME:-payment_db}
      AUTH_SERVICE_URL: http://auth-service:8001
      TUITION_SERVICE_URL: http://tuition-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      SAGA_LEASE_SECONDS: ${SAGA_LEASE_SECONDS:-90}
      SAGA_RETRY_SECONDS: ${SAGA_RETRY_SECONDS:-10}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-3}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      tuition-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Separate process for durable Saga recovery and transactional outbox delivery.
  payment-worker:
    build:
      context: ./backend/payment-service
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${PAYMENT_DB_USER:-payment_user}:${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}@postgres:5432/${PAYMENT_DB_NAME:-payment_db}
      AUTH_SERVICE_URL: http://auth-service:8001
      TUITION_SERVICE_URL: http://tuition-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      SAGA_LEASE_SECONDS: ${SAGA_LEASE_SECONDS:-90}
      SAGA_RETRY_SECONDS: ${SAGA_RETRY_SECONDS:-10}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-3}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      tuition-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/notification-service
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-iBanking <noreply@ibanking.local>}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      tuition-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_TUITION_API_URL: ${VITE_TUITION_API_URL:-http://localhost:8080}
      VITE_PAYMENT_API_URL: ${VITE_PAYMENT_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
