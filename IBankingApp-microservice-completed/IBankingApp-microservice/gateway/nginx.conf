# Central entry point for browser-facing APIs. No internal debit/refund endpoints exposed.
log_format request_trace '$remote_addr request_id=$request_id method=$request_method uri=$uri status=$status duration=$request_time upstream=$upstream_addr';
server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $request_id always;
    access_log /dev/stdout request_trace;
    error_log /dev/stderr warn;

    location = /health { add_header Content-Type application/json; return 200 '{"status":"ok","service":"api-gateway"}'; }
    location ~ ^/api/auth/(deduct|refund)/?$ { return 404; }
    location ~ ^/api/tuitions/[^/]+/pay/?$ { return 404; }
    location /api/auth/ {
        proxy_pass http://auth-service:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/tuitions/ {
        proxy_pass http://tuition-service:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/payments/ {
        proxy_pass http://payment-service:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
