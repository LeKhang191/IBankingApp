# Optional local-only overlay used by ONECLICK-1-START.bat.
# Avoids Gmail setup for first-run OTP: all email is captured by Mailpit.
services:
  mailpit-demo:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:18026:8025"
    expose:
      - "1025"
    restart: unless-stopped

  notification-service:
    environment:
      SMTP_HOST: mailpit-demo
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_ALLOW_UNAUTHENTICATED: "true"
      EMAIL_FROM: "iBanking Demo <noreply@example.com>"
    depends_on:
      mailpit-demo:
        condition: service_started
